# Local OCI registry for developing the schema-shipping path.
#
# Anonymous, plain HTTP, no TLS -- this exists so `just push` has somewhere to
# push. Do not model a real deployment on it: production wants TLS, auth, and
# per-partner robot accounts (Harbor projects, ghcr packages, ECR repos).
#
# Registry v3 is the first release with the OCI 1.1 referrers API, which is
# what lets signatures and reports attach to a schema artifact.
services:
  registry:
    image: registry:3
    container_name: vitrine-registry
    restart: unless-stopped
    ports:
      # 5000 collides with AirPlay Receiver on macOS.
      - '5050:5000'
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry-data:/var/lib/registry

volumes:
  registry-data:
